[package]
name = "cellular-automata"
version = "0.1.0"
edition = "2024"

[lib]
name = "cellular_automata"
path = "src/lib.rs"

[[bin]]
name = "cellular-automata"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
naga = { version = "30", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# Only seeded ChaCha is used, so no OS entropy (keeps getrandom out of the wasm build).
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
anyhow = "1"
log = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
pollster = "1"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "Location",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileReader",
    "File", "FileList", "Event", "EventTarget",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# Web bundle: `trunk build --release --cargo-profile web`. The GPU does the heavy work, so a
# smaller wasm (faster download and compile) beats CPU micro-optimisation here.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
