[package]
name = "cellular-automata"
version = "0.1.0"
edition = "2024"

[lib]
name = "cellular_automata"
path = "src/lib.rs"

[[bin]]
name = "cellular-automata"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
naga = { version = "30", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
rand = "0.10"
rand_chacha = "0.10"
rfd = "0.17"
pollster = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
